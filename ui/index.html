<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'"><title>Terminal</title><link rel="stylesheet" href="app.css"></head>
<body>
<div class="app">
 <main>
  <div class="workspace"><div class="tabs-row"><div id="tabs" role="tablist" aria-label="终端标签"></div><button id="tab-plus" title="新增连接 Ctrl+T">＋</button><div class="tab-status"><span id="status-dot" class="status-dot"></span><span id="status">未连接</span><span id="session-count" hidden></span></div></div>
   <div class="workspace-body"><div id="terminals"><div id="empty"><span class="empty-symbol">›_</span><button id="empty-new" class="empty-connect">连接服务器 ↗</button><div id="recent-profiles" aria-label="最近连接"></div></div></div>
    <aside id="files" hidden><div class="panel-title"><span>文件浏览 <small>SFTP</small></span><button id="files-close" title="关闭文件面板">×</button></div><div id="files-hint">请先连接 SSH。</div><div id="files-content" hidden><form id="path-form"><button type="button" id="parent-dir" title="上一级">↑</button><input id="remote-path" aria-label="远程路径" value="."><button title="前往">↵</button></form><div class="file-actions"><button id="upload">↑ 上传</button><button id="mkdir">＋ 文件夹</button><button id="refresh" title="刷新">↻</button></div><div id="file-list"></div><div class="transfer-row"><div id="transfer" aria-live="polite"></div><button id="transfer-toggle" hidden>暂停</button></div></div></aside>
   </div>
  </div>

 </main>
</div>

<div id="session-menu" popover role="menu" aria-label="会话操作"></div>
<dialog id="quick-auth-dialog"><form id="quick-auth-form"><div class="dialog-heading"><h2 id="quick-auth-title"></h2><button type="button" data-close="quick-auth-dialog">×</button></div><label><span id="quick-auth-label">密码</span><input id="quick-secret" type="password" autocomplete="off"></label><div class="dialog-actions"><button type="submit" class="primary">连接</button></div></form></dialog>
<div id="file-menu" popover role="menu" aria-label="文件操作"></div>
<div id="connections-menu" popover>
 <div class="menu-heading">连接 <button id="add-profile" title="新建 SSH 连接">＋</button></div>
 <div id="profiles" class="profiles"></div>
 <details id="new-menu"><summary>新增 <span>›</span></summary><div class="submenu"><button id="new-ssh">SSH 连接 <small>远程</small></button><button id="new-local">本地终端 <small>PowerShell / CMD</small></button></div></details>
</div>
<dialog id="settings-dialog"><div class="dialog-heading"><h2>设置</h2><button data-close="settings-dialog" title="关闭">×</button></div>
 <div class="setting-row"><span>字体</span><select id="terminal-font" aria-label="终端字体"><option value="JetBrains Mono">JetBrains Mono</option><option value="Consolas">Consolas</option><option value="SimHei">黑体</option><option value="FangSong">仿宋</option></select></div>
 <div class="setting-row"><span>字号</span><div class="size-control"><button id="font-minus" title="减小字号">−</button><span id="font-size">14</span><button id="font-plus" title="增大字号">＋</button><button id="font-reset" title="恢复默认字号">重置</button></div></div>
 <div class="setting-row"><label for="shell">本地 Shell</label><select id="shell"><option value="powershell">PowerShell</option><option value="cmd">CMD</option></select></div>
</dialog>
<dialog id="connect-dialog"><form id="connect-form"><div class="dialog-heading"><div><h2>SSH 连接</h2></div><button type="button" data-close="connect-dialog" title="关闭">×</button></div><label>连接名称<input name="name" placeholder="例如：开发服务器" required maxlength="60"></label><div class="form-row"><label class="grow">主机地址<input name="host" placeholder="192.168.1.100" required></label><label class="port">端口<input name="port" type="number" value="22" min="1" max="65535" required></label></div><label>用户名<input name="username" placeholder="用户名" required autocomplete="off"></label><label>认证方式<select id="auth"><option value="password">密码</option><option value="key">SSH 私钥</option></select></label><label id="password-label">密码<input name="password" type="password" autocomplete="off" placeholder="密码"></label><label id="remember-label" class="remember-label"><input id="remember-password" type="checkbox">保存密码</label><div id="key-fields" hidden><label>私钥文件<div class="input-group"><input name="keyPath" placeholder="选择本地私钥文件"><button type="button" id="choose-key">浏览</button></div></label><label>私钥口令（可选）<input name="passphrase" type="password" autocomplete="off"></label></div><div class="dialog-actions"><button type="button" id="delete-profile" hidden>删除配置</button><button type="button" id="save-profile" class="outline">仅保存配置</button><button type="submit" class="primary">连接 →</button></div></form></dialog>
<dialog id="search-dialog"><div class="search-input-wrap"><span>⌕</span><input id="search-input" placeholder="搜索所有已打开终端的历史输出…" aria-label="全局搜索"><kbd>ESC</kbd><button data-close="search-dialog" title="关闭">×</button></div><div class="search-toolbar"><span id="search-summary">搜索终端</span><label><input type="checkbox" id="case-sensitive"> 区分大小写</label></div><div id="search-results"></div><div class="search-foot">覆盖各终端最近 10,000 行 · 点击结果跳转并高亮</div></dialog>
<dialog id="help-dialog"><div class="dialog-heading"><h2>快捷键</h2><button data-close="help-dialog" title="关闭">×</button></div><div class="shortcut-list"><div><span>复制选中文本 / 无选区时中断</span><kbd>Ctrl C</kbd></div><div><span>粘贴到终端</span><kbd>Ctrl V</kbd></div><div><span>连接 / 关闭当前终端</span><kbd>Ctrl T / Ctrl W</kbd></div><div><span>切换终端</span><kbd>Ctrl Tab</kbd></div><div><span>全局搜索 / 关键词高亮</span><kbd>Ctrl K / Ctrl Shift F</kbd></div><div><span>所有终端统一调整字号</span><kbd>Ctrl + 滚轮</kbd></div><div><span>恢复默认字号</span><kbd>Ctrl 0</kbd></div><div><span>重命名标签页</span><kbd>双击标签</kbd></div></div></dialog>
<dialog id="text-dialog"><form id="text-form"><h2 id="text-title"></h2><input id="text-value" required autocomplete="off"><div class="dialog-actions"><button type="button" data-close="text-dialog" class="outline">取消</button><button class="primary">确定</button></div></form></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-message"></p><div class="dialog-actions"><button id="confirm-no" class="outline">取消</button><button id="confirm-yes" class="primary">确定</button></div></dialog>
<div id="toast" role="status"></div><script src="app.js"></script>
</body></html>
